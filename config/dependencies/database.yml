services:
  database_engine:
    class: src.infra.database.services.database_engine_factory.DatabaseEngineFactory
    kwargs:
      database_url: '@DATABASE_URL'
      debug: '@DEBUG'

  async_session_factory:
    class: src.infra.database.services.session_factory.SessionFactory
    kwargs:
      engine: '@database_engine'

  database_manager:
    class: src.infra.database.services.database_manager.DatabaseManager
    kwargs:
      engine: '@database_engine'
      session_factory: '@async_session_factory'
