services:
  # Event Handlers
  connection_handler:
    class: src.app.events.handlers.connection_handler.ConnectionHandler

  screen_event_handler:
    class: src.app.events.handlers.screen_event_handler.ScreenEventHandler
    kwargs:
      onboarding_repository: '@onboarding_content_repository'
      chat_history_service: '@chat_history_service'

  integration_handler:
    class: src.app.events.handlers.integration_handler.IntegrationHandler
    kwargs:
      integration_content_repository: '@integration_content_repository'
      chat_history_service: '@chat_history_service'

  knowledge_repository_handler:
    class: src.app.events.handlers.knowledge_repository_handler.KnowledgeRepositoryHandler

  teammate_behaviour_handler:
    class: src.app.events.handlers.teammate_behaviour_handler.TeammateBehaviourHandler
    kwargs:
      teammate_behaviour_repository: '@teammate_behaviour_repository'
      chat_history_service: '@chat_history_service'

  role_handler:
    class: src.app.events.handlers.role_handler.RoleHandler
    kwargs:
      role_repository: '@role_repository'
      tenant_role_repository: '@tenant_role_repository'
      tenant_tasks_repository: '@tenant_tasks_repository'
      chat_history_service: '@chat_history_service'

  role_tasks_handler:
    class: src.app.events.handlers.role_tasks_handler.RoleTasksHandler
    kwargs:
      role_tasks_repository: '@role_tasks_repository'
      tenant_tasks_repository: '@tenant_tasks_repository'
      chat_history_service: '@chat_history_service'

  journey_transition_handler:
    class: src.app.events.handlers.journey_transition_handler.JourneyTransitionHandler
    kwargs:
      onboarding_status_repository: '@onboarding_status_repository'

  # Event Registry
  event_registry:
    class: src.app.events.event_registry.EventRegistry
    kwargs:
      connection_handler: '@connection_handler'
      screen_event_handler: '@screen_event_handler'
      integration_handler: '@integration_handler'
      knowledge_repository_handler: '@knowledge_repository_handler'
      teammate_behaviour_handler: '@teammate_behaviour_handler'
      role_handler: '@role_handler'
      role_tasks_handler: '@role_tasks_handler'
      journey_transition_handler: '@journey_transition_handler'
